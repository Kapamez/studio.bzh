let audioCtx = null, stream = null, node = null, source = null, sink = null, workletReady = false;
let recBuf = null, recActive = null;   // capture en cours
const clips = {};                       // id -> {blob, bytes(Uint8Array), url, seconds}

const speakerInput = document.getElementById('speaker');
speakerInput.value = localStorage.getItem('nxt-speaker') || '';
speakerInput.addEventListener('input', () => localStorage.setItem('nxt-speaker', speakerInput.value));

function spk() { return (speakerInput.value || 'phone').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'phone'; }
function fname(id) { return id + '_' + spk() + '.wav'; }

function refresh() {
  let n = 0;
  document.querySelectorAll('li').forEach(li => {
    const id = li.dataset.id;
    const done = !!clips[id] || localStorage.getItem('nxt-' + id) === '1';
    li.classList.toggle('done', done);
    if (done) n++;
    const st = li.querySelector('.status');
    const has = !!clips[id];
    li.querySelector('.replay').style.display = has ? '' : 'none';
    li.querySelector('.redo').style.display = has ? '' : 'none';
    li.querySelector('.del').style.display = has ? '' : 'none';
    if (has) { st.textContent = 'prise OK ✓ ' + clips[id].seconds.toFixed(1) + 's'; st.className = 'status ok'; }
    else { st.textContent = ''; st.className = 'status'; }
  });
  document.getElementById('progress').textContent = n + ' / ' + PROMPTS.length;
  document.getElementById('nclip').textContent = Object.keys(clips).length;
}

function deleteClip(id) {
  if (!clips[id]) return;
  URL.revokeObjectURL(clips[id].url);
  delete clips[id];
  localStorage.setItem('nxt-' + id, '0');
  refresh();
}

async function getMic() {
  if (stream && stream.active) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  document.getElementById('notice').textContent = 'Micro autorisé — parle naturellement, comme à un assistant. Le micro se coupe entre les prises.';
}

async function toggle(btn) {
  const li = btn.closest('li');
  const id = li.dataset.id;
  if (recActive === id) { finishCapture(id, btn); return; }
  if (recActive) finishCapture(recActive, document.querySelector('li[data-id="' + recActive + '"] .rec'));
  try { await getMic(); }
  catch (e) { alert('Accès micro refusé : autorise le micro pour cette page (icône cadenas dans la barre d\'adresse).'); return; }
  if (!audioCtx) audioCtx = new AudioContext();
  await audioCtx.resume();
  source = audioCtx.createMediaStreamSource(stream);
  if (!workletReady) {
    const workletCode = 'class R extends AudioWorkletProcessor{process(inputs){const c=inputs[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor("rec",R);';
    try {
      const url = URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' }));
      await audioCtx.audioWorklet.addModule(url);
      workletReady = true;
    } catch (e) {}
  }
  if (workletReady) node = new AudioWorkletNode(audioCtx, 'rec');
  else node = audioCtx.createScriptProcessor(4096, 1, 1);  // repli navigateurs anciens
  recBuf = [];
  recActive = id;
  if (node.port) node.port.onmessage = e => recBuf.push(new Float32Array(e.data));
  else node.onaudioprocess = e => recBuf.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  source.connect(node);
  // Sortie muette : ScriptProcessor doit être connecté à destination pour
  // fonctionner, mais en direct cela renverrait le micro au haut-parleur (écho).
  if (node.connect) {
    if (!sink) { sink = audioCtx.createGain(); sink.gain.value = 0; sink.connect(audioCtx.destination); }
    node.connect(sink);
  }
  btn.classList.add('stop'); btn.textContent = '■';
}

function finishCapture(id, btn) {
  if (!recActive || recActive !== id) return;
  recActive = null;
  try { source.disconnect(); } catch (e) {}
  if (node.port) node.port.onmessage = null; else node.onaudioprocess = null;
  try { node.disconnect(); } catch (e) {}
  // Coupe physiquement le micro après chaque prise — sinon Chrome garde la LED
  // d'utilisation allumée en permanence (bug constaté sur la v1 de la page).
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  btn.classList.remove('stop'); btn.textContent = '●';
  // Concaténation manuelle : .flat()/concat n'aplatissent PAS les Float32Array
  // (pas des Array JS) — ils seraient restés des éléments uniques et raw aurait
  // contenu des NaN, donc des prises silencieuses.
  let total = 0; for (const c of recBuf) total += c.length;
  const raw = new Float32Array(total);
  let off = 0; for (const c of recBuf) { raw.set(c, off); off += c.length; }
  recBuf = [];
  if (raw.length < audioCtx.sampleRate * 0.3) {
    alert('Prise trop courte (< 0,3 s) — réessaie.');
    return;
  }
  const wav = downsample(raw, audioCtx.sampleRate, 16000);
  const bytes = encodeWav(wav);
  if (clips[id]) URL.revokeObjectURL(clips[id].url);
  clips[id] = { bytes, blob: new Blob([bytes], { type: 'audio/wav' }),
                url: URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' })), seconds: wav.length / 16000 };
  localStorage.setItem('nxt-' + id, '1');
  refresh();
}

function downsample(buf, inRate, outRate) {
  const ratio = inRate / outRate;
  const n = Math.floor(buf.length / ratio);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * ratio), e = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = s; j < e; j++) sum += buf[j];
    out[i] = sum / (e - s);
  }
  return out;
}

function encodeWav(f32) {
  const buf = new ArrayBuffer(44 + f32.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + f32.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, f32.length * 2, true);
  let o = 44;
  for (let i = 0; i < f32.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}

// --- ZIP (méthode store, sans compression : le WAV l'est déjà assez) ---
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function makeZip(entries) {
  const enc = new TextEncoder();
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parts = [], central = [];
  let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name), crc = crc32(e.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, e.data.length, true); lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, e.data);
    central.push({ name, crc, size: e.data.length, offset });
    offset += 30 + name.length + e.data.length;
  }
  const cdStart = offset;
  for (const c of central) {
    const h = new DataView(new ArrayBuffer(46));
    h.setUint32(0, 0x02014b50, true); h.setUint16(4, 20, true); h.setUint16(6, 20, true); h.setUint16(8, 0, true); h.setUint16(10, 0, true);
    h.setUint16(12, dosTime, true); h.setUint16(14, dosDate, true);
    h.setUint32(16, c.crc, true); h.setUint32(20, c.size, true); h.setUint32(24, c.size, true);
    h.setUint16(28, c.name.length, true); h.setUint32(42, c.offset, true);
    parts.push(new Uint8Array(h.buffer), c.name);
    offset += 46 + c.name.length;
  }
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, central.length, true); end.setUint16(10, central.length, true);
  end.setUint32(12, offset - cdStart, true); end.setUint32(16, cdStart, true);
  parts.push(new Uint8Array(end.buffer));
  return new Blob(parts, { type: 'application/zip' });
}

function dlAll() {
  const ids = Object.keys(clips);
  if (!ids.length) { alert('Aucune prise enregistrée.'); return; }
  const zip = makeZip(ids.map(id => ({ name: fname(id), data: clips[id].bytes })));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zip);
  a.download = 'corpus_vocal_' + spk() + '_' + new Date().toISOString().slice(0, 10) + '.zip';
  document.body.appendChild(a); a.click(); a.remove();
}

const ul = document.getElementById('list');
for (const p of PROMPTS) {
  const li = document.createElement('li');
  li.dataset.id = p.id;
  const id = document.createElement('span'); id.className = 'id'; id.textContent = p.id;
  const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = p.text;
  const btns = document.createElement('div'); btns.className = 'btns';
  const recBtn = document.createElement('button'); recBtn.className = 'rec'; recBtn.textContent = '●';
  recBtn.onclick = () => toggle(recBtn);
  const playBtn = document.createElement('button'); playBtn.className = 'replay'; playBtn.textContent = '▶ écouter'; playBtn.style.display = 'none';
  playBtn.onclick = () => { const c = clips[p.id]; if (c) new Audio(c.url).play(); };
  const redoBtn = document.createElement('button'); redoBtn.className = 'mini redo'; redoBtn.textContent = '↺ refaire'; redoBtn.style.display = 'none';
  redoBtn.onclick = () => toggle(recBtn);   // la nouvelle prise écrase l'ancienne à l'arrêt
  const delBtn = document.createElement('button'); delBtn.className = 'mini del'; delBtn.textContent = '🗑'; delBtn.style.display = 'none';
  delBtn.onclick = () => { if (confirm('Supprimer la prise de ' + p.id + ' ?')) deleteClip(p.id); };
  const st = document.createElement('span'); st.className = 'status';
  btns.appendChild(recBtn); btns.appendChild(playBtn); btns.appendChild(redoBtn); btns.appendChild(delBtn); btns.appendChild(st);
  li.appendChild(id); li.appendChild(txt); li.appendChild(btns);
  ul.appendChild(li);
}
refresh();
addEventListener('beforeunload', () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
</script>
