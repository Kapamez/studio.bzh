let stream = null, rec = null, chunks = [], activeId = null;
const clips = {};  // id -> {blob, url}
const speakerInput = document.getElementById('speaker');
speakerInput.value = localStorage.getItem('nxt-speaker') || '';
speakerInput.addEventListener('input', () => localStorage.setItem('nxt-speaker', speakerInput.value));

function spk() { return (speakerInput.value || 'phone').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '') || 'phone'; }
function fname(id) { return id + '_' + spk() + '.webm'; }

function refresh() {
  let n = 0;
  document.querySelectorAll('li').forEach(li => {
    const id = li.dataset.id;
    const done = !!clips[id] || localStorage.getItem('nxt-' + id) === '1';
    li.classList.toggle('done', done);
    if (done) n++;
    const st = li.querySelector('.status');
    if (clips[id]) { st.textContent = 'prise OK ✓'; st.className = 'status ok'; }
  });
  document.getElementById('progress').textContent = n + ' / ' + PROMPTS.length;
  document.getElementById('nclip').textContent = Object.keys(clips).length;
}

async function getMic() {
  if (stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  document.getElementById('notice').textContent = 'Micro autorisé — bon enregistrement ! Parle naturellement, comme à un assistant.';
  return stream;
}

async function toggle(btn) {
  const li = btn.closest('li');
  const id = li.dataset.id;
  if (rec && activeId === id) {
    rec.stop();
    return;
  }
  if (rec) { rec.stop(); }  // coupe la prise en cours ailleurs
  let s;
  try { s = await getMic(); }

  chunks = [];
  activeId = id;
  rec = new MediaRecorder(s, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm' });
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    if (!chunks.length) return;
    const blob = new Blob(chunks, { type: 'audio/webm' });
    if (clips[id]) URL.revokeObjectURL(clips[id].url);
    clips[id] = { blob, url: URL.createObjectURL(blob) };
    localStorage.setItem('nxt-' + id, '1');
    btn.classList.remove('stop');
    btn.textContent = '●';
    refresh();
  };
  rec.start();
  btn.classList.add('stop');
  btn.textContent = '■';
}

function dl(id) {
  const c = clips[id];
  if (!c) return;
  const a = document.createElement('a');
  a.href = c.url;
  a.download = fname(id);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function dlAll() {
  const ids = Object.keys(clips);
  if (!ids.length) { alert('Aucune prise enregistrée.'); return; }
  if (confirm('Télécharger ' + ids.length + ' fichiers dans Téléchargements ?')) ids.forEach((id, i) => setTimeout(() => dl(id), i * 400));
}
function dlOne() {
  const sel = document.querySelector('li.sel');
  dl(sel ? sel.dataset.id : Object.keys(clips).at(-1));
}

const ul = document.getElementById('list');
for (const p of PROMPTS) {
  const li = document.createElement('li');
  li.dataset.id = p.id;
  const id = document.createElement('span'); id.className = 'id'; id.textContent = p.id;
  const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = p.text;
  const btns = document.createElement('div'); btns.className = 'btns';
  const recBtn = document.createElement('button'); recBtn.className = 'rec'; recBtn.textContent = '●';
  recBtn.onclick = () => toggle(recBtn);
  const playBtn = document.createElement('button'); playBtn.className = 'replay'; playBtn.textContent = '▶ écouter'; playBtn.style.display = 'none';
  playBtn.onclick = () => { const c = clips[p.id]; if (c) new Audio(c.url).play(); };
  const st = document.createElement('span'); st.className = 'status';
  btns.appendChild(recBtn); btns.appendChild(playBtn); btns.appendChild(st);
  li.appendChild(id); li.appendChild(txt); li.appendChild(btns);
  ul.appendChild(li);
}
refresh();
</script>
</body>
