<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>studio.bzh</title>
  <meta name="description" content="studio.bzh — Made in BZH.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon_16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Racing+Sans+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1b1c1e;
      --fg: #c8d1d9;
      --fg-muted: rgba(200, 209, 217, 0.52);
      --border: rgba(200, 209, 217, 0.14);
      --border-hover: rgba(200, 209, 217, 0.4);
      --surface: rgba(200, 209, 217, 0.03);
      --surface-hover: rgba(200, 209, 217, 0.07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 6vw, 64px);
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--fg-muted);
      letter-spacing: 0.04em;
    }

    main {
      margin: auto 0;
      padding: 40px 0;
    }

    h1 {
      font-size: clamp(3.8rem, 11vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.95;
      color: var(--fg);
      margin-bottom: 16px;
    }

    .tagline {
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: var(--fg-muted);
      font-weight: 400;
      margin-bottom: 56px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--fg-muted);
      margin-bottom: 14px;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      width: 100%;
      max-width: 520px;
      padding: 22px 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--fg);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-link:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .project-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .project-name {
      font-family: 'Racing Sans One', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.01em;
      color: var(--fg);
    }

    .project-desc {
      font-size: 0.92rem;
      color: var(--fg-muted);
    }

    .arrow {
      font-size: 1.25rem;
      color: var(--fg-muted);
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .project-link:hover .arrow {
      transform: translateX(4px);
      color: var(--fg);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--fg-muted);
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    footer a {
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--fg);
    }
  </style>
</head>
<body>

  <header>
    <span>studio.bzh</span>
    <span>BZH</span>
  </header>

  <main>
    <h1>studio.bzh</h1>
    <p class="tagline">Made in BZH.</p>

    <p class="section-label">Réalisation</p>
    <a href="https://studio.bzh/nextation" class="project-link">
      <div class="project-info">
        <span class="project-name">Nextation</span>
        <span class="project-desc">Horaires de trains, simplifiés</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <footer>
    <span>© 2026 studio.bzh</span>
    <a href="mailto:support@studio.bzh">support@studio.bzh</a>
  </footer>

</body>
</html>
